Sample name: LUZ7
fasta file: input/genome_data/LUZ7_US449_spikein.fasta
enriched fastq: input/fastq_data/LUZ7_US449_t5_enriched.fastq
control fastq: input/fastq_data/LUZ7_US449_t5_control.fastq
ID: t5
termseq alpha: 0.001
spike-in name: FLuc

cluster width:
  TSS: 5
  TTS: 25

minimum coverage: 
  enriched:
    TSS: 5
    TTS: 20
  control:
    TSS: 5
    TTS: 20
    
peak alignment error: 1
spike-in name: FLuc
TTS threshold: 0.20

TSS sequence extraction:
  upstream: 50
  downstream: 5

TTS sequence extraction:
  upstream: 50
  downstream: 50


motifs:
  dedup distance: 10            # windows closer than this are one promoter
  min sequences: 5              # independent windows needed to run MEME
  nmotifs: 3
  minw: 6
  maxw: 20
  mode: zoops
  markov order: 2
  # optional: genome for the background model. Default: "fasta file", reduced
  # to the records named in the training headers (e.g. LUZ7)
  # genome fasta: input/genome_data/LUZ7.fasta
  # genome records: [NC_013691.1]

# --- shared by scan_background and scan_candidates --------------------------
motif background:
  n random windows: 1000
  fimo threshold: 0.001
  fimo options: "--norc"
  # no "motif file" line: both scans then use
  # results/promoter_motifs/{sample}_{ident}/meme/meme.txt

# --- _0 candidate selection (rules/scan_candidates.smk) ---------------------
candidate selection:
  phage records: null           # null = the {sample} name (e.g. LUZ7)
  min enriched reads: 0
  min enrichment ratio: 1.0
  exclude near _1: 0

motif rescue:
  target fpr: 0.05  #standard value from literature => check with "ground truth"

TU detection:
  TSS window: 5        # a read starts "at" a TSS if its 5' end is within this many nt
  TTS window: 20       # a read ends "at" a TTS if its 3' end is within this many nt
  minimum reads: 1     # reads needed to keep a TSS -> TTS pair
  # step 8, genes per TU
  gene annotation: input/genome_data/LUZ7.gff3   # GFF of the phage genes only (e.g. NCBI NC_013691.1)
  gene features: gene                           # GFF column 3 types to use, e.g. "gene" or "gene|ncRNA"
  gene name attribute: Name                     # attribute shown as the gene name, e.g. Name or locus_tag
  gene overlap fraction: 0.9                    # fraction of a gene that must lie inside the TU (papers: 0.9)